<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Activities</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="/static/stylesheets/defaults.css">
      <link rel="stylesheet" href="/static/stylesheets/activities.css">
      <link rel="stylesheet" href="/static/stylesheets/navbar.css">
   </head>
   <body>

      <div id="navbar-container"></div>
      <div class="grid-container">
         <div class="grid-element">
            <div class="activity-grid">
               {{range .Activities}}
               <a class="activity-card" href="/activities/{{.ID}}">
                  <div class="activity-preview">
                     <img src="{{.Details.Route}}" alt="{{.Details.Name}} route preview">
                  </div>
                  <div class="activity-card-content">
                     <div>
                        <h2>{{.Details.Name}}</h2>
                        <p>{{.Details.Date}}</p>
                     </div>
                     <span class="activity-arrow" aria-hidden="true">&#8599;</span>
                  </div>
               </a>
               {{end}}
            </div>
         </div>
      </div>

      <script src="/static/javascript/navbar.js"></script>

   </body>
</html>
